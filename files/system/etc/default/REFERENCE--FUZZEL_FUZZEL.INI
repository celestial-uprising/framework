# ==============================================================================
# FUZZEL CONFIGURATION REFERENCE TEMPLATE
# Documentation: man fuzzel.ini
# ==============================================================================

# --- MAIN RUNTIME CONFIGURATION ---
[main]
# Font definition using fontconfig syntax
font=JetBrainsMono Nerd Font:size=14
dpi-aware=auto

# Application launch tracking (sorts frequently used items first)
icon-theme=Adwaita
icons-enabled=yes

# Prompt character showing next to the search string
prompt="❯ "
placeholder="Search apps..."

# Control the window behavior and layout rendering style
# options: filename, name, generic, exec, comment
fields=name,generic,exec
password-character=*
show-actions=no

# Terminal application to use when launching command-line CLI apps (via Shift+Enter)
terminal=kitty -e

# --- WINDOW LAYOUT AND GEOMETRY ---
# Controls how the picker window draws on your compositor layout
anchor=center
lines=15
width=40
tabs=4
horizontal-pad=24
vertical-pad=16
inner-pad=10

# Adjust borders and rounded geometry corners
image-size-ratio=0.5
line-height=24
letter-spacing=0

# Enforce explicit window margins if anchored to edges
# margin-top=0
# margin-bottom=0

# --- COLOR SCHEMES AND THEMEING ---
# Formatted as HEX transparency codes: RRGGBBAA
[colors]
background=1e1e2eff        # Deep Indigo (Catppuccin Mocha Base)
text=cdd6f4ff              # Off-white / Latte text
match=f38ba8ff             # Crimson / Rose highlight for searched text matches
selection=313244ff         # Dark slate highlighted background row
selection-text=a6e3a1ff    # Mint Green text on the active selected item
selection-match=f38ba8ff   # Match highlight color on the active row
border=b4befeff            # Lavender outer frame border line

# Custom rendering parameters for borders
[border]
width=2
radius=12

# --- PHYSICS AND ANIMATION SLIDES ---
[dmenu]
mode=text                  # choices: text, index
exit-immediately-if-empty=no

# ==============================================================================
# KEYBINDING DICTIONARY MAP
# ==============================================================================
# Key notations follow the standard XKB keyboard string conventions
[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter
execute-or-next=Tab

# List Navigation
cursor-up=Up Control+p
cursor-down=Down Control+n
cursor-left=Left
cursor-right=Right

# Page and Boundary Jumping
page-up=Page_Up
page-down=Page_Down
cursor-home=Home Control+a
cursor-end=End Control+e

# Text String Manipulation
delete-prev=BackSpace
delete-prev-word=Control+BackSpace
delete-next=Delete
delete-next-word=Control+Delete

# Selection Action Alternates
insert-selected=Control+Tab

