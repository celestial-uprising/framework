# ==============================================================================
# KITTY TERMINAL CONFIGURATION REFERENCE TEMPLATE
# Documentation: https://kovidgoyal.net
# ==============================================================================

# --- FONTS AND RENDERING ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Fine-tune typographic features
force_ltr no
adjust_line_height  0
adjust_column_width 0
disable_ligatures   never

# --- TEXT CURSOR CUSTOMIZATION ---
cursor           #cdd6f4
cursor_text_color #1e1e2e
cursor_shape     block
cursor_blink_interval -1
cursor_stop_blinking_after 15.0

# --- SCROLLBACK BUFFER ---
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# --- MOUSE ACTIONS AND INTERACTIONS ---
mouse_hide_wait 3.0
url_color        #b4befe
url_style        curly
open_url_with    default
url_prefixes     http https file ftp gemini gopher
detect_urls      yes
copy_on_select   no
strip_trailing_spaces never
select_by_word_characters @-./_~?&=%+#
click_interval   -0.5
focus_follows_mouse no
pointer_shape_when_grabbed arrow
default_pointer_shape xterm
pointer_shape_when_dragging beam

# --- PERFORMANCE AND REFRESH TUNING ---
repaint_delay    8
input_delay      3
sync_to_monitor  yes

# --- AUDIO / VISUAL BELLS ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab      "🔔 "

# --- WINDOW LAYOUTS AND MARGINS ---
remember_window_size  no
initial_width         1000
initial_height        650
enabled_layouts       splits,stack,fat,tall,grid
window_resize_step_cells 2
window_resize_step_lines 2
window_border_width   1.0pt
draw_minimal_borders  yes
window_margin_width   0
single_window_margin_width -1
window_padding_width  8
placement_strategy    center
active_border_color   #b4befe
inactive_border_color #313244
bell_border_color     #f38ba8
inactive_text_alpha   1.0
hide_window_decorations yes
resize_debounce_time  0.1
confirm_os_window_close 0

# --- TAB BAR DESIGN ---
tab_bar_edge          top
tab_bar_margin_width  0.0
tab_bar_style         powerline
tab_bar_min_tabs      2
tab_switch_strategy   previous
tab_fade              0.25 0.5 0.75 1
tab_powerline_style   slanted
tab_activity_symbol   none
active_tab_title_template none
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
inactive_tab_font_style normal
tab_bar_background      #11111b

# --- GRAPHICS PROTOCOLS (Crucial for Yazi/RMPC art!) ---
# Controls the image rendering constraints for modern TUIs
allow_remote_control yes
listen_on            none
shell_integration    enabled

# --- CATPPUCCIN MOCHA BASE COLOR PALETTE ---
foreground       #cdd6f4
background       #1e1e2e
background_opacity 0.95
dynamic_background_opacity yes
dim_opacity 0.75
selection_foreground #1e1e2e
selection_background #f5e0dc

# Standard 16 ANSI Terminal Colors
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# --- SHELL PATH INTERACTIVE FALLBACK ---
shell .
editor nvim
close_on_child_death no

# ==============================================================================
# HOTKEY REMAP DICTIONARY
# ==============================================================================
clear_all_shortcuts no
kitty_mod ctrl+shift

# Clipboard Management
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection

# Scrolling Controls
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

# Tab Navigation
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+t     new_tab
map kitty_mod+q     close_tab
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward

# Layout Sizing Adjustments
map kitty_mod+equal     change_font_size all +2.0
map kitty_mod+minus     change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

# Configuration Live Reloading Hook
map kitty_mod+f5 load_config_file

