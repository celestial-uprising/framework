# ==============================================================================
# GLOBAL CARGO CONFIGURATION REFERENCE TEMPLATE
# Documentation: https://rust-lang.org
# ==============================================================================

# --- BUILD SYSTEM TUNING ---
[build]
# Speeds up local builds significantly by utilizing modern parallel linkers.
# 'mold' is highly recommended for Linux/Window Managers.
# Fallback choices: "clang", "lld", or omit to use standard system ld.
rustlink-arg = ["-C", "link-arg=-fuse-ld=mold"]

# Target directory cache (Optional: uncomment if you want all projects 
# to share a single target cache directory to preserve disk space on Atomic setups)
# target-dir = "~/.cache/cargo-target"

# --- REGISTRY & DOWNLOAD PERFORMANCE ---
[registries.crates-io]
# Enforces the modern sparse HTTP protocol instead of pulling down the entire 
# massive git index history repo. (This is the Cargo default in modern versions).
protocol = "sparse"

[net]
# Number of concurrent download streams allowed for fetching dependencies
retry = 3
git-fetch-with-cli = true # Uses your system's native git instead of built-in libgit2

# --- COMPILER FRONTEND MULTI-THREADING ---
[env]
# Instructs the compiler frontend to use multiple threads for initial macro 
# parsing and type-checking phases (Nightly/Recent stable feature).
CARGO_FRONTEND_NUM_THREADS = "max"

# --- ADVANCED GLOBAL PROFILE TUNING ---
# These flags apply globally whenever you compile binary crates or tools
[profile.dev]
opt-level = 0         # Prioritize pure compilation speed for local dev iterations
debug = true          # Include complete debugging symbols
incremental = true    # Enable incremental compilation caches
overflow-checks = true

[profile.release]
opt-level = 3         # Prioritize maximum runtime performance execution execution loops
lto = "thin"          # Link-Time Optimization: "thin" balances compilation speed and binary size. Use "fat" for absolute max speed.
codegen-units = 16    # Splits crates into chunks for parallel compilation (1 = max optimizations, higher = faster builds)
panic = "unwind"      # Choices: "unwind", "abort". Abort results in smaller binary sizes.
strip = false         # Set to true or "symbols" to automatically strip binaries of debugging data to drastically minimize file footprint.

# Profile override specifically for compilation dependencies (crates you download)
# This keeps your main crate quick to build but fully optimizes the dependencies it relies on.
[profile.dev.package."*"]
opt-level = 2

