# Markdown preview: the active Markdown document rendered in the side place, following the editor
# while it scrolls and changing as you type. Every key: https://rhun.app/extensions/v1/ section 2
# and v1.1 "Retained views" (feature view-doc).
name = markdown
owner = rhun-editor
title = Markdown Preview
description = The active Markdown document rendered beside the editor, following it as you scroll and type.
color = #4a7bd0
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/markdown-linux-x86_64
run.macos-arm64 = bin/markdown-macos-arm64
run.windows-x64 = bin/markdown-windows-x64.exe
on = command

[commands]
show = Markdown: Open Preview | ctrl+shift+v

[subscribe]
opened = *.md *.markdown *.mdown
changed = *.md *.markdown *.mdown

[needs]
documents = read

[views]
preview.title = Preview
preview.place = side
preview.kind = doc
