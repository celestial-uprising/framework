name = lsp
owner = rhun-editor
title = Language Server
description = Installation guides and language features: completion, problems, hover, navigation, refactoring, formatting, semantic colors and hints.
icon = icon.png
color = #3f9f6f
version = 0.3.5
protocol = 1
run.linux-x86_64 = bin/lsp-linux-x86_64
run.macos-arm64 = bin/lsp-macos-arm64
run.windows-x64 = bin/lsp-windows-x64.exe
on = lang:Go lang:Rust lang:TypeScript lang:JavaScript lang:Python lang:C lang:C++ lang:Zig lang:Lua lang:Ruby lang:Dart lang:Kotlin lang:Swift lang:OCaml lang:Haskell lang:Elixir lang:Nix lang:Terraform lang:HCL lang:YAML lang:JSON lang:HTML lang:CSS

[commands]
setup = Set Up Language Server
restart = Restart Language Servers
reload_configuration = Reload Language Server Settings
cancel_progress = Cancel All Language Server Work

[subscribe]
opened = *
saved = *
edits = *
hover = *

[needs]
documents = write
# Servers compile and index the project (Cargo, Dune, Mix, Ruby Bundler).
project = write
# the default servers, the programs they run (gopls runs go, rust-analyzer cargo and rustc), then
# the alternatives the README lists for lsp.ini: the sandbox starts nothing else
network = yes
run = @build getconf nix git xcode-select xcrun tr echo zsh clang cc ld ar bash uname dirname basename readlink which sed grep cut ls xargs java kotlinc dune ghc ghc-pkg cabal stack elixir erl mix zig swift swiftc node gopls go rust-analyzer cargo rustc typescript-language-server pyright-langserver clangd zls lua-language-server solargraph dart kotlin-language-server sourcekit-lsp ocamllsp haskell-language-server-wrapper elixir-ls nil terraform-ls yaml-language-server vscode-json-language-server vscode-html-language-server vscode-css-language-server ty pylsp basedpyright-langserver jedi-language-server ruff vtsls deno ccls ruby-lsp haskell-language-server nixd

# the language features of section 12 of the protocol and of protocol 1.1, from the server;
# F12, shift+F12, ctrl+r, ctrl+. , F2 and shift+alt+f are rhun's own keys for them. Each running
# server narrows these to the kinds and files it really serves (provider-scope).
[provides]
complete = *.go *.rs *.ts *.tsx *.js *.jsx *.mjs *.cjs *.py *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.zig *.lua *.rb *.dart *.kt *.kts *.swift *.ml *.mli *.hs *.ex *.exs *.nix *.tf *.yaml *.yml *.json *.html *.htm *.css
complete.triggers = . : >
