name = snippets
owner = rhun-editor
title = Snippets
description = Snippets with fields you Tab through, in the completion list as you type, and Expand Snippet for a short name.
icon = icon.png
color = #b88a2a
version = 0.3.0
protocol = 1
run.linux-x86_64 = bin/snippets-linux-x86_64
run.macos-arm64 = bin/snippets-macos-arm64
run.windows-x64 = bin/snippets-windows-x64.exe
on = command

[commands]
expand = Expand Snippet
insert = Insert Snippet...

# protocol 1.1: both edit the document, so they show and run only while a text document that can
# be edited has the keys (when clauses)
[command-options]
expand.when = editorFocus && !editorReadonly
insert.when = editorFocus && !editorReadonly

# KEYS = COMMAND [ARGS] [when CLAUSE]; the user's own [keys] can pass a snippet's name to insert
# (command-args): ctrl+alt+t = snippets.insert td
[keys]
ctrl+alt+e = expand when editorFocus && !editorReadonly

# the editor's context menu: Insert Snippet... over the selection or at the cursor
[menu.editor]
insert.group = snippets
insert.when = !editorReadonly

[subscribe]
opened = *
cursor = *
selection = *

[needs]
documents = write
project = read

# the completion list offers the snippets of the document's language (section 12b)
[provides]
complete = *
