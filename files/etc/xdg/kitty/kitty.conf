shell_integration enabled
term xterm-256color
scrollback_lines 10000
copy_on_select yes
strip_trailing_spaces smart
font_family      family="VictorMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0
cursor_shape block
cursor_blink_interval 1
window_padding_width 0
background_opacity 0.5
hide_window_decorations yes
tab_bar_style powerline
tab_bar_align left
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5
tab_bar_margin_color    #1a1110
tab_bar_background              #1a1110
active_tab_foreground           #000000
active_tab_background           #ffb4ab
active_tab_font_style           bold
inactive_tab_foreground         #d8c2bf
inactive_tab_background         #1a1110
inactive_tab_font_style         normal
tab_activity_symbol             " ● "
tab_title_template              "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template       "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
foreground            #f1dedc
background            #1a1110
selection_foreground #B5BD91
selection_background #E1B8BC
selection_background #1a1110
url_color             #ffb4ab
cursor               #E1B8BC
cursor_text_color    #B5BD91
#cursor #f1dedc
#cursor_text_color #d8c2bf
#cursor_text_color #1a1110

# Normal Colors (0-7)
color0  #B5BD91
color1  #D98A8A
color2  #94B5A0
color3  #A8C3A8
color4  #9B7E9F
color5  #F7A8B8
color6  #A4D8D8
color7  #E1B8BC
# Bright Colors (8-15)
color8  #B0C4B1
color9  #E59898
color10 #A3C9AE
color11 #BDE3CA
color12 #B298B6
color13 #FFB6C1
color14 #B4EAEA
color15 #F4DCDD

# Key bindings
map ctrl+n new_window
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+tab select_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 0
