name: zetta-core
description: Celestial Uprising's Immutable Operating System
base-image: quay.io/fedora/fedora-bootc
image-version: 44
stages:
  - name: driver-builder
    from: quay.io/fedora/fedora-bootc:44
    modules:
      - type: containerfile
        snippets:
          - |
            dnf install -y \
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm \
              https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm && \
            dnf config-manager setopt \
              "rpmfusion-free*.includepkgs=*nvidia*,*vaapi*" \
              "rpmfusion-free*.excludepkgs=ffmpeg*,libav*" \
              "rpmfusion-nonfree*.includepkgs=*nvidia*,*cuda*" \
              "rpmfusion-nonfree*.excludepkgs=ffmpeg*,libav*" && \
            KVER=$(cd /usr/lib/modules && echo *) && \
            dnf install -y akmod-nvidia zfs-dkms && \
            akmods --kernels "$KVER" --force && \
            dkms autoinstall -k "$KVER" && \
            dnf clean all
  - name: builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: copy
        src: files/scripts/stage1/*
        dest: /tmp/
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - dnf5 upgrade -y
          - |
            bash /tmp/netop.sh
            bash /tmp/asak.sh
            bash /tmp/terminactory.sh
            bash /tmp/binstall.sh
            bash /tmp/golang-44.sh
            bash /tmp/tidemail.sh
            bash /tmp/corgi.sh
            bash /tmp/kb.sh
            bash /tmp/llmv.sh
            bash /tmp/pi-bolt.sh
modules:
  - type: os-release
    properties:
      NAME: "Zetta"
      PRETTY_NAME: "Zetta a05 by Celestial Uprising"
      VERSION_CODENAME: "raven"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/zetta/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/zetta/"
      VARIANT: "zetta-core"
      RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia-drm.modeset=1
  - type: containerfile
    snippets:
      - |
        dnf install -y \
          https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
          https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm \
          https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm && \
        dnf config-manager setopt \
          "rpmfusion-free*.includepkgs=*nvidia*,*vaapi*" \
          "rpmfusion-free*.excludepkgs=ffmpeg*,libav*" \
          "rpmfusion-nonfree*.includepkgs=*nvidia*,*cuda*" \
          "rpmfusion-nonfree*.excludepkgs=ffmpeg*,libav*"
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - rustup
        - libquadmath
        - libquadmath-devel
        - xorg-x11-drv-nvidia-cuda
        - libva-nvidia-driver
        - zfs
        - mpv
        - chromium-headless
        - distcc
        - ccache
        - smartmontools
        - radare2
        - just
        - ov
        - asciinema
        - rizin
        - gh
        - firewalld
        - zram-generator-defaults
        - glibc-langpack-en
        - podman-compose
        - podman-docker
        - podman-remote
        - buildah
        - sysstat
        - strace
        - tcpdump
        - whois
        - distrobox
        - sshfs
        - rsync
        - iw
        - iwd
        - iwlwifi-mvm-firmware
        - iwlbluetooth-firmware
        - mediatek-firmware
        - NetworkManager-wifi
        - pciutils
        - usbutils
        - kernel-modules-extra
        - tailscale
        - libvirt-client
        - vim
        - nmap
        - traceroute
        - uv
        - neovim
        - python3-neovim
        - luarocks
        - tree-sitter-cli
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - fzf
        - pdfgrep
        - powertop
        - nvtop
        - radeontop
        - s-tui
        - lm_sensors
        - btop
        - gdu
        - pastel
        - git
        - wget
        - plymouth-theme-spinner
        - nodejs
        - npm
  - type: containerfile
    snippets:
      - COPY --from=driver-builder /usr/lib/modules/ /usr/lib/modules/
      - COPY --from=driver-builder /var/lib/dkms/ /var/lib/dkms/
      - RUN echo "blacklist nouveau" > /etc/modprobe.d/blacklist-nouveau.conf
      - RUN systemctl enable zfs.target zfs-import-scan.service zfs-mount.service
  - type: copy
    from: builder
    src: /tmp/bin/
    dest: /usr/bin/
  - type: copy
    from: builder
    src: /tmp/skel/
    dest: /etc/skel/
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
        - JetBrainsMono
  - type: files
    files:
      - source: extras/aoccv6/
        destination: /tmp/
  - type: script
    scripts:
      - aoccv6.sh
  - type: files
    files:
      - source: usr/lib/bash/libflyline
        destination: /usr/lib/bash/libflyline.so
  - type: files
    files:
      - source: etc/profile.d/flyline.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: etc/profile.d/locale.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: etc/profile.d/aliases.sh
        destination: /etc/profile.d/
  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - firewalld.service
        - iwd.service
    user:
      enabled:
        - podman.socket
  - type: script
    scripts:
      - bash-completion-helper.sh
      - annoyances.sh
  - type: containerfile
    snippets:
      - |
        dnf remove -y rpmfusion-free-release rpmfusion-nonfree-release && \
        rm -f /etc/yum.repos.d/rpmfusion*.repo && \
        dnf clean all
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
