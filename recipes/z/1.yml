name: zetta-core
description: Celestial Uprising's Immutable Operating System
base-image: quay.io/fedora/fedora-bootc
image-version: 44
stages:
  - name: driver-builder
    from: quay.io/fedora/fedora-bootc:44
    modules:
      - type: containerfile
        snippets:
          - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
          - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
          - RUN sed -i -E '/^\[rpmfusion-free(-updates)?\]/a includepkgs=*nvidia*,*vaapi*\nexcludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-free*.repo
          - RUN sed -i -E '/^\[rpmfusion-nonfree(-updates)?\]/a includepkgs=*nvidia*,*cuda*\nexcludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-nonfree*.repo
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dnf install -y akmod-nvidia zfs-dkms
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && akmods --kernels $KVER --force && dkms autoinstall -k $KVER && dnf clean all
modules:
  - type: os-release
    properties:
      NAME: "Zetta"
      PRETTY_NAME: "Zetta a05 by Celestial Uprising"
      VERSION_CODENAME: "raven"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/zetta/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/zetta/"
      VARIANT: "zetta-core"
      RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia-drm.modeset=1
  - type: containerfile
    snippets:
      - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
      - RUN sed -i -E '/^\[rpmfusion-free(-updates)?\]/a includepkgs=*nvidia*,*vaapi*\nexcludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-free*.repo
      - RUN sed -i -E '/^\[rpmfusion-nonfree(-updates)?\]/a includepkgs=*nvidia*,*cuda*\nexcludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-nonfree*.repo
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - rustup
        - libquadmath
        - libquadmath-devel
        - xorg-x11-drv-nvidia-cuda
        - libva-nvidia-driver
        - zfs
        - mpv
        - chromium-headless
        - distcc
        - ccache
        - smartmontools
        - radare2
        - just
        - ov
        - asciinema
        - rizin
        - gh
        - firewalld
        - zram-generator-defaults
        - glibc-langpack-en
        - podman-compose
        - podman-docker
        - podman-remote
        - buildah
        - sysstat
        - strace
        - tcpdump
        - whois
        - distrobox
        - sshfs
        - rsync
        - iw
        - iwd
        - iwlwifi-mvm-firmware
        - iwlbluetooth-firmware
        - mediatek-firmware
        - NetworkManager-wifi
        - pciutils
        - usbutils
        - kernel-modules-extra
        - tailscale
        - libvirt-client
        - vim
        - nmap
        - traceroute
        - uv
        - neovim
        - python3-neovim
        - luarocks
        - tree-sitter-cli
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - fzf
        - pdfgrep
        - powertop
        - nvtop
        - radeontop
        - s-tui
        - lm_sensors
        - btop
        - gdu
        - pastel
        - git
        - wget
        - plymouth-theme-spinner
        - nodejs
        - npm
  - type: containerfile
    snippets:
      - COPY --from=driver-builder /usr/lib/modules/ /usr/lib/modules/
      - COPY --from=driver-builder /var/lib/dkms/ /var/lib/dkms/
      - RUN echo "blacklist nouveau" > /etc/modprobe.d/blacklist-nouveau.conf
      - RUN systemctl enable zfs.target zfs-import-scan.service zfs-mount.service
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
        - JetBrainsMono
  - type: files
    files:
      - source: extras/aoccv6/
        destination: /tmp/
  - type: script
    scripts:
      - aoccv6.sh
  - type: files
    files:
      - source: usr/lib/bash/libflyline
        destination: /usr/lib/bash/libflyline.so

  - type: files
    files:
      - source: etc/profile.d/flyline.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: etc/profile.d/locale.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: etc/profile.d/aliases.sh
        destination: /etc/profile.d/
  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - firewalld.service
        - iwd.service
    user:
      enabled:
        - podman.socket
  - type: script
    scripts:
      - annoyances.sh
  - type: containerfile
    snippets:
      - RUN dnf remove -y rpmfusion-free-release rpmfusion-nonfree-release && rm -f /etc/yum.repos.d/rpmfusion*.repo && dnf clean all
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
