type: script
snippets:
  - |
    #!/usr/bin/env bash

    set -oue pipefail

    mkdir -p /usr/lib/tmpfiles.d
    cat <<EOF > /usr/lib/tmpfiles.d/mpd-user.conf
    d       %h/.config/mpd          0755 %U  %G   -   -
    d       %h/.config/mpd/playlists 0755 %U  %G   -   -
    EOF

    cat << 'EOF' > /etc/profile.d/niri-launch.sh
    if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then
      exec niri-session
    fi
    EOF
