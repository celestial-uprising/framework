type: files
files:
  - source: niri-config.kdl
    destination: /etc/niri/config.kdl
  - source: waybar-config-nv.jsonc
    destination: /etc/xdg/waybar/config.jsonc
  - source: waybar-style-nv.css
    destination: /etc/xdg/waybar/style.css
  - source: fuzzel-fuzzel.ini
    destination: /etc/xdg/fuzzel/fuzzel.ini
  - source: kitty-kitty.conf
    destination: /etc/xdg/kitty.conf
  - source: gpu-switch.sh
    destination: /usr/bin/gpu-switch.sh
  - source: mpd-user.conf
    destination: /usr/lib/tmpfiles.d/mpd-user.conf
