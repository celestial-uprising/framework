# yaml-language-server: $schema=https://blue-build.org
name: oglaroon-muse
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/oglaroon
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "oglaroon-muse"
  - type: kargs
    kargs:
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - krita
        - inkscape
        - gimp
        - kdenlive
        - blender
        - ardour9
        - audacity
        - kicad
        - kicad-packages3d
        - mypaint
        - mypaint-brushes
        - opentoonz
        - scribus
        - obs-studio
        - obs-studio-plugin-vaapi
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.electronstudio.WeylusCommunityEdition
  - type: files
    files:
      - source: 99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: 99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
      - source: 60-weylus.rules
        destination: /etc/sysctl.d/60-weylus.rules
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
