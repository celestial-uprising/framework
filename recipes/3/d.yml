# yaml-language-server: $schema=https://blue-build.org
name: yotta-dev
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/yotta
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "yotta-dev"
  - type: kargs
    kargs:
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - upower 
        - qemu-system-x86
        - qemu-system-aarch64
        - edk2-aarch64
        - qemu-system-riscv
        - qemu-img
        - qemu-audio-pipewire
        - virglrenderer
        - qemu-device-display-virtio-gpu-gl
        - qemu-ui-opengl
        - qemu-audio-spice
        - qemu-char-spice
        - qemu-device-display-qxl
        - spice-gtk
        - libguestfs-tools
        - virt-install
        - virt-top
        - libvirt
        - libvirt-daemon-qemu
        - libvirt-daemon-driver-secret
        - libvirt-daemon-driver-nodedev
        - libvirt-daemon-driver-interface
        - libvirt-daemon-driver-nwfilter
        - libvirt-daemon-config-network
        - libvirt-daemon-driver-network
        - libvirt-daemon-driver-storage
        - libvirt-daemon-driver-storage-zfs
  - type: files
    files:
      - source: extras/99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: extras/99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
  - type: systemd
    system:
      enabled:
        - virtqemud.socket
        - virtnetworkd.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtstoraged.socket
        - virtqemud.service
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
