type: script
snippets:
  - |
    #!/usr/bin/env bash

    echo "Configuring universal default user..."
    if ! getent passwd core > /dev/null 2>&1; then
        useradd -m -G wheel -s /bin/bash core
    fi

    echo 'core:$6$.A7a8GHIpZOnY7oJ$bhTkuXCP7vdGPoAK8jSaxSeFY5W.v9ek1PjAh6zJCdgke/yOSXdUYXMRV98QR5pZdaJYDPRPPkyuwK9EDr4p4.' | chpasswd -e

    mkdir -p /etc/sudoers.d
    echo '%wheel ALL=(ALL) ALL' > /etc/sudoers.d/wheel
