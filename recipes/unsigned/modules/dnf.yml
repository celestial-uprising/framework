type: dnf
repos:
  copr:
    - atim/lazygit
    - atim/starship
    - kylegospo/amdctl
install:
  packages:
    - lazygit
    - starship
    - power-profiles-daemon
    - fontconfig
    - mesa-dri-drivers
    - mesa-vulkan-drivers
    - vulkan-loader
    - vulkan-tools
    - amdctl
    - cascadia-code-nf-fonts
    - glibc-langpack-en
    - libvirt-client
    - libvirt-client-qemu
    - neovim
    - fzf
    - fd-find
    - ripgrep
    - zoxide
    - bat
    - eza
    - luarocks
    - tree-sitter-cli
    - python3-neovim
    - btop
    - rocm-smi-devel
    - nvtop
    - radeontop
    - libdrm-devel
    - s-tui
    - tree
    - vim
    - git
    - wget
    - gdu
    - diskus
    - nmap
    - traceroute
    - whois
    - rustup
remove:
  packages:
    - nano
    - nano-default-editor
    - nfs-client-utils
    - nfs-common-utils
    - azure-vm-utils
    - cockpit
    - cockpit-bridge
    - cockpit-ws
