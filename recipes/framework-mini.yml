---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: framework-mini
description: for humans- by lesbidoodles ; with hope for a better future

base-image: ghcr.io/ublue-os/ucore
image-version: testing


stages:

  - name: yazi-builder
    base-image: docker.io/library/fedora:latest # Clean image to compile on
    modules:
      - type: script
        snippets:
          - |
            dnf install -y git gcc cargo

            git clone https://github.com/sxyazi/yazi.git /tmp/yazi
            cd /tmp/yazi
            cargo build --release --locked

            mkdir -p /tmp/bin
            cp target/release/yazi /tmp/bin/
            cp target/release/ya /tmp/bin/


modules:

  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - yalter/niri
    install:
      packages:
        - glibc-langpack-en
        - sddm-conf
        - sddm-wayland-generic
        - waybar
        - fuzzel
        - kitty
        - niri
        - vim
        - fzf
        - ripgrep
        - zoxide
        - fd-find
        - bat
        - eza
        - btop
        - nvtop
        - radeontop
        - starship
        - tree-sitter-cli
        - rocm-smi-devel
        - neovim
        - python3-neovim
        - wl-clipboard
        - luarocks
        - git
        - wget
        - s-tui
        - libdrm-devel
        - gdu
        - ncdu
        - tree
        - diskus
        - nmap
        - traceroute
        - whois
        - swaybg
        - flatpak
        - loupe

    remove:
      packages:
        - nano
        - alacritty
        - nano-default-editor
        - nfs-client-utils
        - nfs-common-utils
        - azure-vm-utils
        - cockpit
        - cockpit-bridge
        - cockpit-ws

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: # system flatpaks
          - net.codelogistics.webapps
          - net.waterfox.waterfox
          - org.virt_manager.virt-manager
      - scope: user

  - type: fonts
    fonts:
      url-fonts:
        - name: VictorMonoNerdFont
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/VictorMono.zip

  - type: copy
    from: yazi-builder
    src: /tmp/bin/yazi
    dest: /usr/bin/yazi

  - type: copy
    from: yazi-builder
    src: /tmp/bin/ya
    dest: /usr/bin/ya


  - type: signing
