---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework-mini
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/ublue-os/ucore
image-version: testing
stages:
  - name: rust-builder
    from: docker.io/library/fedora:latest
    modules:
      - type: script
        snippets:
          - |
            dnf install -y git gcc protobuf-compiler
            curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            mkdir -p /tmp/bin
            git clone https://github.com/sxyazi/yazi.git /tmp/yazi
            cd /tmp/yazi && cargo build --release --locked
            cp target/release/yazi /tmp/bin/
            cp target/release/ya /tmp/bin/
            git clone https://github.com/herdrdev/herdr.git /tmp/herdr
            cd /tmp/herdr && cargo build --release --locked
            cp target/release/herdr /tmp/bin/
            git clone https://github.com/HalFrgrd/flyline.git /tmp/flyline
            cd /tmp/flyline && cargo build --release --locked
            cp target/release/flyline /tmp/bin/
            CARGO_HOME=/tmp/cargo cargo install --root /tmp/build uv
            cp /tmp/build/bin/uv* /tmp/bin/
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: fonts
    fonts:
      url-fonts:
        - name: VictorMonoNerdFont
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/VictorMono.zip
  - type: copy
    from: rust-builder
    src: /tmp/bin/yazi
    dest: /usr/bin/yazi
  - type: copy
    from: rust-builder
    src: /tmp/bin/ya
    dest: /usr/bin/ya
  - type: copy
    from: rust-builder
    src: /tmp/bin/herdr
    dest: /usr/bin/herdr
  - type: copy
    from: rust-builder
    src: /tmp/bin/flyline
    dest: /usr/bin/flyline
  - type: copy
    from: rust-builder
    src: /tmp/bin/uv
    dest: /usr/bin/uv
  - type: copy
    from: rust-builder
    src: /tmp/bin/uvx
    dest: /usr/bin/uvx
  - type: copy
    from: rust-builder
    src: /tmp/bin/uvw
    dest: /usr/bin/uvw
  - type: dnf
    repos:
      copr:
        - atim/starship
        - yalter/niri
        - atim/lazygit
    install:
      packages:
        - sddm-conf
        - sddm-wayland-generic
        - niri
        - swaybg
        - waybar
        - glibc-langpack-en
        - fuzzel
        - kitty
        - remmina
        - flatpak
        - neovim
        - fzf
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - lazygit
        - jq
        - luarocks
        - tree-sitter-cli
        - python3-neovim
        - wl-clipboard
        - starship
        - btop
        - rocm-smi-devel
        - nvtop
        - radeontop
        - libdrm-devel
        - s-tui
        - tree
        - vim
        - git
        - wget
        - gdu
        - ncdu
        - diskus
        - nmap
        - traceroute
        - whois
    remove:
      packages:
        - nano
        - alacritty
        - nano-default-editor
        - nfs-client-utils
        - nfs-common-utils
        - azure-vm-utils
        - cockpit
        - cockpit-bridge
        - cockpit-ws
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install: # system flatpaks
          - md.obsidian.Obsidian
          - io.github.olaproeis.Ferrite
          - com.valvesoftware.SteamLink
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
          - net.waterfox.waterfox
          - org.virt_manager.virt-manager
      - scope: user
  - type: script
    snippets:
      - |
        for group in wheel render libvirt docker video; do
          if ! getent group "$group" >/dev/null; then
            groupadd -r "$group" || true
          fi
        done

        if ! getent passwd shepherd >/dev/null; then
          useradd -m -G wheel,render,libvirt,docker,video -f -o -p $(openssl passwd -6 'celestial') shepherd || true
        else
          usermod -aG wheel,render,libvirt,docker,video shepherd || true
        fi

        mkdir -p /etc/profile.d
        echo 'if [[ $- == *i* ]]; then eval "$(flyline init)"; fi' > /etc/profile.d/flyline.sh

        cat << 'EOF' > /etc/profile.d/distrobox-aliases.sh
        alias db="distrobox enter"
        alias dbc="distrobox create"
        EOF

        echo 'export STARSHIP_CONFIG=/etc/starship.toml' > /etc/profile.d/starship-env.sh
        echo 'eval "$(starship init bash)"' > /etc/profile.d/starship.sh
        starship preset jetpack -o /etc/starship.toml

  - type: signing
