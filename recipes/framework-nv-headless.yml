---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework-nv-headless
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/ublue-os/ucore-hci
image-version: testing-nvidia
# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - vim
        - fzf
        - ripgrep
        - zoxide
        - fd-find
        - bat
        - eza
        - btop
        - nvtop
        - radeontop
        - starship
        - tree-sitter-cli
        - rocm-smi-devel
        - neovim
        - python3-neovim
        - wl-clipboard
        - luarocks
        - git
        - wget
        - s-tui
        - stress-ng
        - libdrm-devel
        - gdu
        - ncdu
        - tree
        - diskus
        - nmap
        - traceroute
        - whois
    remove:
      packages:
        - nano
        - nano-default-editor
        - nfs-client-utils
        - nfs-common-utils
        - azure-vm-utils
        - cockpit
        - cockpit-bridge
        - cockpit-ws

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      url-fonts:
        - name: VictorMonoNerdFont
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/VictorMono.zip

  - type: signing
