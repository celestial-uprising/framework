# yaml-language-server: \$schema=https://blue-build.org
name: rusty
description: Celestial Uprising --- magrathea
base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44


stages:


  - name: rust
    from: docker.io/library/rust:latest
    modules:

      - type: copy
        src: files/cargo-list.md
        dest: /tmp/cargo-list.md

      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - |
            apt-get update && apt-get install -y libdrm-dev pkg-config

            MD_FILE="/tmp/cargo-list.md"
            
            if [ ! -f "$MD_FILE" ]; then
              echo "Error: $MD_FILE not found!"
              exit 1
            fi

            echo "Parsing $MD_FILE and running installations..."
            
            # Read each line sequentially, filtering out lines that don't have 'cargo install'
            while read -r line || [ -n "$line" ]; do
              # Ensure the line actually contains the install command
              case "$line" in
                *"cargo install"*)
                  echo "----------------------------------------"
                  echo "Executing: $line --root /tmp"
                  echo "----------------------------------------"
                  
                  # Run the install command, redirecting the binary to /tmp/bin
                  $line --root /tmp
                  ;;
              esac
            done < "$MD_FILE"


modules: 


    - type: os-release
      properties:
        NAME: "Celestial Uprising"
        PRETTY_NAME: "Celestial Uprising a003"
        VERSION_CODENAME: "magrathea"
        ID_LIKE: fedora
        HOME_URL: "https://github.com/celestial-uprising/framework/"
        BUG_REPORT_URL: "https://github.com/celestial-uprising/framework/"
        VARIANT: "rusty"
        RELEASE_TYPE: "alpha"


    - type: dnf

      repos:
        files:
          - https://copr.fedorainfracloud.org/coprs/ublue-os/packages/repo/fedora-%OS_VERSION%/ublue-os-packages-fedora-%OS_VERSION%.repo

      install:
        install-weak-deps: false
        packages:
          - just
          - ublue-os-udev-rules
          - ublue-os-update-services
          - ublue-os-signing
          - ublue-os-luks
          - ublue-os-just
          - vim
          - firewall-config

      remove:
        packages:
          - libva
          - mesa-dri-drivers
          - gstreamer1-plugin-libav
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-vulkan-drivers
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - ffmpeg-free
          - fdk-aac-free
          - gstreamer1-plugins-ugly-free
          - libavcodec-free
          - libavdevice-free
          - libavfilter-free
          - libavformat-free
          - libavutil-free
          - libpostproc-free
          - libswresample-free
          - libswscale-free
          - firefox
          - nano
          - nano-default-editor
          - nfs-client-utils
          - nfs-common-utils
          - azure-vm-utils
          - cockpit
          - cockpit-bridge
          - cockpit-ws


    - type: copy
      from: rust
      src: /tmp/bin/
      dest: /usr/bin/
