name: core
description: Celestial Uprising's Immutable Operating System
base-image: quay.io/fedora/fedora-bootc
image-version: 44

stages:
  # -------------------------------------------------------------------
  # STAGE 1: Driver Builder (Compiles NVIDIA & ZFS against Fedora 44 kernel)
  # -------------------------------------------------------------------
  - name: driver-builder
    from: quay.io/fedora/fedora-bootc:44
    modules:
      - type: containerfile
        snippets:
          - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
          - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dnf install -y kernel-devel-$KVER akmod-nvidia zfs-dkms
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && akmods --kernels $KVER --force && dkms autoinstall -k $KVER && dnf clean all

  # -------------------------------------------------------------------
  # STAGE 2: Rusty Stage (Your tool/binary compiler stage)
  # -------------------------------------------------------------------
  - name: rusty
    from: quay.io/fedora/fedora:44
    modules:
      - type: copy
        src: files/cargo-nobinstall.md
        dest: /tmp/cargo-nobinstall.md
      - type: copy
        src: files/cargo-binstall.md
        dest: /tmp/cargo-binstall.md
      - type: copy
        src: files/goblin-install.md
        dest: /tmp/goblin-install.md
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - |
            dnf5 upgrade -y && dnf5 install -y \
              zig libdrm-devel pkg-config pam-devel cargo rustc \
              systemd-devel libunwind-devel elfutils-devel \
              protobuf-compiler perl clang-devel llvm-devel \
              openssl-devel dbus-devel jack-audio-connection-kit-devel \
              alsa-lib-devel cmake make gcc-c++ python3 python3-devel \
              fontconfig-devel m4 pipewire-devel libva-devel libcxx-devel \
              llvm-libunwind libpcap-devel golang \
              libusb1-devel bluez-libs-devel pulseaudio-libs-devel libcap-devel zlib-devel \
              tar gzip curl
            curl -fsSL https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xz -C /usr/bin cargo-binstall
            MD_FILE="/tmp/cargo-nobinstall.md"
            while read -r line || [ -n "$line" ]; do
              case "$line" in
                *"cargo install"*)
                  $line --root /tmp
                  ;;
              esac
            done < "$MD_FILE"
            MD_FILE1="/tmp/cargo-binstall.md"
            while read -r line || [ -n "$line" ]; do
              case "$line" in
                *"cargo binstall"*)
                  $line --root /tmp
                  ;;
              esac
            done < "$MD_FILE"
            MD_FILE2="/tmp/goblin-install.md"
            if [ -f "$MD_FILE2" ]; then
              while read -r line || [ -n "$line" ]; do
                case "$line" in
                  *"go install"*)
                    if ! env GOBIN=/tmp/bin $line; then
                      echo "ERROR: Failed to install Go tool: $line"
                    fi
                    ;;
                esac
              done < "$MD_FILE2"
            fi
            dnf5 clean all

modules:
  - type: os-release
    properties:
      NAME: "Celestial Uprising"
      PRETTY_NAME: "Celestial Uprising a13"
      VERSION_CODENAME: "candyfloss"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/framework/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/framework/"
      VARIANT: "core"
      RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia-drm.modeset=1

  # -------------------------------------------------------------------
  # Enable Repositories in Main Image before DNF Module
  # -------------------------------------------------------------------
  - type: containerfile
    snippets:
      - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Removed packages that were already installed in base-image:
        # zram-generator, bash-completion, linux-firmware, jq, unzip, curl
        - zram-generator-defaults
        - whois
        - distrobox
        - sshfs
        - rsync
        - iw
        - iwd
        - iwlwifi-mvm-firmware
        - NetworkManager-wifi
        - pciutils
        - kernel-modules-extra
        - glibc-langpack-en
        - tailscale
        - libvirt-client
        - vim
        - nmap
        - traceroute
        - uv
        - neovim
        - python3-neovim
        - luarocks
        - tree-sitter-cli
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - fzf
        - pdfgrep
        - powertop
        - nvtop
        - radeontop
        - s-tui
        - lm_sensors
        - btop
        - gdu
        - hyperfine
        - pastel
        - git
        - make
        - fontconfig-devel
        - wget
        - plymouth-theme-spinner
        - nodejs
        - npm
        - xorg-x11-drv-nvidia-cuda
        - libva-nvidia-driver
        - zfs

  # -------------------------------------------------------------------
  # COPY COMPILED MODULES & CONFIGURE SERVICES
  # -------------------------------------------------------------------
  - type: containerfile
    snippets:
      - COPY --from=driver-builder /usr/lib/modules/ /usr/lib/modules/
      - COPY --from=driver-builder /var/lib/dkms/ /var/lib/dkms/
      - RUN echo "blacklist nouveau" > /etc/modprobe.d/blacklist-nouveau.conf
      - RUN systemctl enable zfs.target zfs-import-scan.service zfs-mount.service
  - type: copy
    from: rusty
    src: /tmp/bin/
    dest: /usr/bin/
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
  - type: files
    files:
      - source: libflyline
        destination: /usr/lib/bash/libflyline.so
  - type: files
    files:
      - source: system/etc/profile.d/flyline.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: system/etc/profile.d/locale.sh
        destination: /etc/profile.d/
  - type: files
    files:
      - source: system/etc/profile.d/aliases.sh
        destination: /etc/profile.d/
  - type: script
    scripts:
      - lazyvim.sh
      - pibolt.sh
      - regenerateinitramfs.sh
