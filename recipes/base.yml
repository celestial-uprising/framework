---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework-base
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/ublue-os/ucore
image-version: testing-nvidia
modules:
  - type: os-release
    properties:
      NAME: "Celestial Uprising"
      PRETTY_NAME: "Celestial Uprising 44.20260829.2.3 (framework)"
      VERSION_CODENAME: "framework"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/framework/"
      DOCUMENTATION_URL: "https://docs.fedoraproject.org/en-US/fedora-coreos/"
      SUPPORT_URL: "https://github.com/coreos/fedora-coreos-tracker/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/framework/"
      VARIANT: "base"
  - type: dnf
    repos:
      copr:
        - atim/lazygit
        - atim/starship
        - che/nerd-fonts
        - kylegospo/amdctl
    install:
      packages:
        - lazygit
        - starship
        - power-profiles-daemon
        - fontconfig
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - vulkan-loader
        - vulkan-tools
        - libva-nvidia-driver
        - amdctl
        - cascadia-code-nf-fonts
        - nerd-fonts
        - glibc-langpack-en
        - libvirt-client
        - libvirt-client-qemu
        - neovim
        - fzf
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - luarocks
        - tree-sitter-cli
        - python3-neovim
        - btop
        - rocm-smi-devel
        - nvtop
        - radeontop
        - libdrm-devel
        - s-tui
        - tree
        - vim
        - git
        - wget
        - gdu
        - diskus
        - nmap
        - traceroute
        - whois
    remove:
      packages:
        - nano
        - nano-default-editor
        - nfs-client-utils
        - nfs-common-utils
        - azure-vm-utils
        - cockpit
        - cockpit-bridge
        - cockpit-ws
  - type: script
    snippets:
      - |
        #!/usr/bin/env bash
        mkdir -p /etc/profile.d

        cat << 'EOF' > /etc/profile.d/distrobox-aliases.sh
        alias db="distrobox enter"
        alias dbc="distrobox create"
        EOF
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
