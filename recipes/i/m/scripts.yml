type: script
snippets:
  - |
    echo "Configuring Greetd and DankGreeter..."
    mkdir -p /etc/greetd

    cat << 'EOF' > /etc/greetd/config.toml
    [terminal]
    vt = 1

    [default_session]
    user = "greeter"
    command = "/usr/bin/dms-greeter --command niri"
    EOF

    mkdir -p /var/cache/dms-greeter
    mkdir -p /var/lib/greeter

    chown -R greeter:greeter /var/cache/dms-greeter
    chown -R greeter:greeter /var/lib/greeter
    chmod 0755 /var/cache/dms-greeter

    systemctl enable greetd.service

