---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/celestial-uprising/framework-headless
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "workstation"
  - type: dnf
    repos:
      copr:
        - ulysg/xwayland-satellite
        - yalter/niri-git
        - sneexy/zen-browser
    install:
      packages:
        - pcmanfm-qt
        - sddm
        - sddm-wayland-generic
        - swaybg
        - swaylock
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - niri
        - xwayland-satellite
        - wl-clipboard
        - fuzzel
        - kitty
        - waybar
        - remmina
        - virt-manager
        - virt-viewer
        - zen-browser
        - flatpak
        - gimp
        - kdenlive
        - blender
        - krita
        - kicad
        - obs-studio
        - ardour8
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - md.obsidian.Obsidian
          - io.github.olaproeis.Ferrite
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
          - io.github.electronstudio.WeylusCommunityEdition
          - io.github.muse_sequencer.Muse
      - scope: user
  - type: signing
