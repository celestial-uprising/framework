name: virt
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/base
image-version: latest
modules:
    - type: os-release
      properties:
        VARIANT: "virt"
    - type: kargs
      kargs:
        - console=tty0
        - console=ttyS0,115200n8
        - scsi_mod.use_blk_mq=1
    - type: dnf
      install:
        install-weak-deps: false
        packages:
          - spice-vdagent
    - type: files
      files:
        - source: dracut-virtio.conf
          destination: /etc/dracut.conf.d/virtio.conf
    - type: script
      scripts:
        - regenerateinitramfs.sh
    - type: wayblue-signing
      source: local
