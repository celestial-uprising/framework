# yaml-language-server: $schema=https://blue-build.org
name: mini
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/core
image-version: latest
stages:
  - name: rusty
    from: quay.io/fedora/fedora:rawhide
    modules:
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - |
            dnf install -y git cargo rustc gcc clang libudev-devel libgbm-devel \
              libxkbcommon-devel cairo-gobject-devel mesa-libEGL-devel wayland-devel \
              libinput-devel dbus-devel systemd-devel libseat-devel \
              pipewire-devel pango-devel libdisplay-info-devel \
              xorg-x11-server-Xwayland libxcb-devel xcb-util-cursor-devel \
              xcb-util-devel xcb-util-image-devel xcb-util-keysyms-devel \
              xcb-util-renderutil-devel xcb-util-wm-devel
            git clone https://github.com/YaLTeR/niri.git
            cd niri
            cargo build --release
            cp target/release/niri /usr/bin/niri
            cp resources/niri.desktop /usr/share/wayland-sessions/niri.desktop
            cp resources/niri-session /usr/bin/niri-session
            dnf clean all
modules:
  - type: os-release
    properties:
      VARIANT: "mini"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - amdgpu.sg_display=0
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - xwayland-satellite
        - upower 
        - spice-vdagent
        - spice-webdavd
        - pipewire
        - mesa-vulkan-drivers
        - google-crc32c
        - gnome-keyring
        - alsa-sof-firmware
        - bluez-libs
        - pulseaudio-libs
        - calcurse
        - sddm
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xfce-polkit
        - rofi-wayland
        - waybar
        - dunst
        - swaybg
        - swaylock
        - swayidle
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - pamixer
        - pavucontrol
        - wlr-randr
        - wlsunset
        - kanshi
        - network-manager-applet
        - blueman
        - bluez-tools
        - google-noto-emoji-fonts
        - qt6-qtvirtualkeyboard
        - qt6-qt5compat
        - kitty
        - zathura
        - zathura-plugins-all
        - mpv
        - ffmpeg
        - ffmpegthumbnailer
        - mpd
        - mpc
        - imv
        - remmina
        - virt-manager
        - headsetcontrol
        - mediainfo
        - playerctl
        - tuned-ppd
        - vulkan-validation-layers
        - vulkan-tools
        - alsa-firmware
        - wireplumber
        - flatpak
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
          - app.zen_browser.zen
  - type: script
    scripts:
      - corgi.sh
      - rhun.sh
      - lazyvim.sh
  - type: copy
    from: rusty
    src: /tmp/bin/
    dest: /usr/bin/
  - type: files
    files:
      - source: system/
        destination: /
  - type: systemd
    system:
      enabled:
        - sddm.service
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
