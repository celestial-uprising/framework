# yaml-language-server: $schema=https://blue-build.org
name: headless
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/core
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "headless"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - zfs.zfs_arc_max=17179869184
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu-system-x86-core
        - qemu-system-aarch64-core
        - qemu-system-riscv-core
        - qemu-img
        - qemu-kvm-core
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-gpu-gl
        - qemu-char-spice
        - spice-server
        - virglrenderer
        - seabios
        - edk2-ovmf
        - edk2-aarch64
        - edk2-riscv
        - libvirt-daemon-kvm
        - libvirt-daemon-qemu
        - libvirt-daemon-common
        - libvirt-client
        - libvirt-nss
        - virt-install
        - libvirt-daemon-config-network
        - dnsmasq
        - iptables-nft
        - vde2
        - vde-cryptcab
        - tuned
        - numactl
        - pciutils
        - usbutils
        - qemu-block-curl
        - tuned-ppd
        - vulkan-validation-layers
        - vulkan-tools
        - ffmpeg
  - type: files
    files:
      - source: 99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: 99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
