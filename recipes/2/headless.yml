# yaml-language-server: $schema=https://blue-build.org
name: headless
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/core
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "headless"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - zfs.zfs_arc_max=17179869184
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu-system-x86
        - qemu-system-arm
        - qemu-system-riscv
        - 
  - type: files
    files:
      - source: 99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: 99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
