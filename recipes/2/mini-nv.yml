# yaml-language-server: $schema=https://blue-build.org
name: mini-nv
description: Celestial-Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/unified-nv
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "mini-nv"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - amdgpu.sg_display=0
  - type: dnf
    repos:
      copr:
        - ulysg/xwayland-satellite
        - yalter/niri-git
        - sneexy/zen-browser
        - ferdiu/moonlight
        - skoved/rmpc
    install:
      install-weak-deps: false
      packages:
        - bluez-libs
        - pulseaudio-libs
        - calcurse
        - niri
        - xwayland-satellite
        - sddm
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xfce-polkit
        - rofi-wayland
        - waybar
        - dunst
        - swaybg
        - swaylock
        - swayidle
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - pamixer
        - pavucontrol
        - wlr-randr
        - wlsunset
        - kanshi
        - network-manager-applet
        - blueman
        - bluez-tools
        - google-noto-emoji-fonts
        - qt6-qtvirtualkeyboard
        - qt6-qt5compat
        - zen-browser
        - kitty
        - zathura
        - zathura-plugins-all
        - mpv
        - ffmpeg
        - ffmpegthumbnailer
        - mpd
        - mpc
        - rmpc
        - imv
        - remmina
        - virt-manager
        - moonlight-qt
        - headsetcontrol
        - mediainfo
        - playerctl
        - tuned-ppd
        - vulkan-validation-layers
        - vulkan-tools
        - alsa-firmware
        - wireplumber
        - flatpak
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - md.obsidian.Obsidian
          - com.valvesoftware.SteamLink
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
  - type: script
    snippets:
      - |
        set -euo pipefail
        
        RELEASES="https://github.com/vshvedov/rhun/releases"
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT

        echo "Fetching latest rhun version..."
        VERSION=$(curl -fsSL "${RELEASES}/latest/download/VERSION" | tr -d ' \r\n')
        NAME="rhun-${VERSION}-linux-x86_64.tar.gz"

        echo "Downloading rhun ${VERSION}..."
        curl -fsSL "${RELEASES}/download/v${VERSION}/${NAME}" -o "${TMP_DIR}/${NAME}"
        curl -fsSL "${RELEASES}/download/v${VERSION}/SHA256SUMS" -o "${TMP_DIR}/SHA256SUMS"

        echo "Verifying checksum..."
        WANT=$(awk -v f="$NAME" '$2 == f || $2 == "*" f { print $1 }' "${TMP_DIR}/SHA256SUMS")
        GOT=$(sha256sum "${TMP_DIR}/${NAME}" | awk '{ print $1 }')
        if [ "$GOT" != "$WANT" ]; then
          echo "Checksum verification failed for ${NAME}"
          exit 1
        fi

        echo "Installing binary to /usr/bin/rhun..."
        mkdir -p "${TMP_DIR}/x"
        tar -xzf "${TMP_DIR}/${NAME}" -C "${TMP_DIR}/x"
        install -Dm755 "${TMP_DIR}/x/rhun-${VERSION}/bin/rhun" /usr/bin/rhun
  - type: files
    files:
      - source: system/
        destination: /
  - type: systemd
    system:
      enabled:
        - sddm.service
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
