# yaml-language-server: $schema=https://blue-build.org
name: yotta-headless
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/yotta-core
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "yotta-headless"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - pcie_aspm=off
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu-system-x86-core
        - qemu-system-aarch64-core
        - qemu-system-riscv-core
        - qemu-img
        - qemu-kvm-core
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-gpu-gl
        - qemu-char-spice
        - spice-server
        - virglrenderer
        - seabios
        - edk2-ovmf
        - edk2-aarch64
        - libvirt-daemon-kvm
        - libvirt-daemon-qemu
        - libvirt-daemon-common
        - libvirt-nss
        - virt-install
        - libvirt-daemon-config-network
        - dnsmasq
        - tuned
        - numactl
        - usbutils
        - qemu-block-curl
        - tuned-ppd
        - vulkan-validation-layers
        - vulkan-tools
        - ffmpeg
  - type: files
    files:
      - source: extras/99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: extras/99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
      - source: usr/lib/tmpfiles.d/libvirt-dnsmasq.conf
        destination: /usr/lib/tmpfiles.d/
  - type: systemd
    system:
      enabled:
        - virtqemud.socket
        - virtnetworkd.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtstoraged.socket
        - virtqemud.service
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
