# yaml-language-server: $schema=https://blue-build.org
name: mini
description: Celestial-Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/unified
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "mini"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - amdgpu.sg_display=0
  - type: dnf
    repos:
      copr:
        - ulysg/xwayland-satellite
        - yalter/niri-git
        - sneexy/zen-browser
        - ferdiu/moonlight
        - skoved/rmpc
    install:
      install-weak-deps: false
      packages:
        - niri
        - xwayland-satellite
        - greetd
        - greetd-tuigreet
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xfce-polkit
        - rofi-wayland
        - waybar
        - dunst
        - swaybg
        - swaylock
        - swayidle
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - pamixer
        - pavucontrol
        - wlr-randr
        - wlsunset
        - kanshi
        - network-manager-applet
        - blueman
        - bluez-tools
        - google-noto-emoji-fonts
        - qt6-qtvirtualkeyboard
        - kf6-qqc2-desktop-style
        - kf6-kirigami-addons
        - kirigami-app-components
        - kf6-kio-gui
        - kf6-kiconthemes
        - kf6-kirigami
        - qt6-qtdeclarative
        - qt6-qt5compat
        - qt6-qtwayland
        - qt5-qtgraphicaleffects
        - qt5-qtquickcontrols2
        - qt5-qtsvg
        - kwallet
        - pam-kwallet
        - zen-browser
        - kitty
        - zathura
        - zathura-plugins-all
        - mpv
        - ffmpeg
        - ffmpegthumbnailer
        - mpd
        - mpc
        - rmpc
        - imv
        - remmina
        - virt-manager
        - moonlight-qt
        - headsetcontrol
        - mediainfo
        - playerctl
        - tuned-ppd
        - vulkan-validation-layers
        - vulkan-tools
        - alsa-firmware
        - wireplumber
        - flatpak
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - md.obsidian.Obsidian
          - com.valvesoftware.SteamLink
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
  - type: systemd
    system:
      enabled:
        - greetd.service
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
