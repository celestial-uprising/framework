name: mini
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/base
image-version: latest
modules:
    - type: os-release
      properties:
        VARIANT: "mini"
    - type: kargs
      kargs:
        - amdgpu.ppfeaturemask=0xffffffff
        - amdgpu.sg_display=0
    - type: dnf
      repos:
        copr:
          - ulysg/xwayland-satellite
          - yalter/niri-git
          - sneexy/zen-browser
          - ferdiu/moonlight
          - skoved/rmpc
      install:
        install-weak-deps: false
        packages:
          - google-noto-emoji-fonts
          - tuned-ppd
          - kf6-qqc2-desktop-style
          - kf6-kirigami-addons
          - kirigami-app-components
          - kf6-kio-gui
          - kf6-kiconthemes
          - kf6-kirigami
          - qt6-qtdeclarative
          - qt6-qt5compat
          - qt6-qtwayland
          - qt5-qtgraphicaleffects
          - qt5-qtquickcontrols2
          - qt5-qtsvg
          - kwallet
          - pam-kwallet
          - headsetcontrol
          - mediainfo
          - xfce-polkit
          - xdg-user-dirs
          - dbus-tools
          - dbus-daemon
          - pavucontrol
          - playerctl
          - vulkan-validation-layers
          - vulkan-tools
          - alsa-firmware
          - pamixer
          - network-manager-applet
          - bluez-tools
          - blueman
          - imv
          - slurp
          - grim
          - wlr-randr
          - wlsunset
          - brightnessctl
          - kanshi
          - dunst
          - mpv
          - ffmpeg
          - ffmpegthumbnailer
          - mpd
          - mpc
          - rmpc
          - imv
          - swaybg
          - swaylock
          - swayidle
          - xdg-desktop-portal-gnome
          - xdg-desktop-portal-gtk
          - niri
          - xwayland-satellite
          - fuzzel
          - kitty
          - waybar
          - zen-browser
          - remmina
          - flatpak
          - virt-manager
          - moonlight-qt
          - playerctl
          - brightnessctl
          - wireplumber
          - network-manager-applet
    - type: default-flatpaks
      configurations:
        - notify: true
          scope: system
          install:
            - md.obsidian.Obsidian
            - com.valvesoftware.SteamLink
            - de.haeckerfelix.Shortwave
            - net.codelogistics.webapps
    - type: systemd
      system:
        enabled:
          - lemurs.service
    - type: script
      scripts:
        - regenerateinitramfs.sh
    - type: wayblue-signing
      source: local
