# yaml-language-server: $schema=https://blue-build.org
name: headless-testing-nv
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/unified-testing-nv
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "headless-testing-nv"
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - zfs.zfs_arc_max=17179869184
      - pcie_aspm=off
  - type: dnf
    repos:
      copr:
        - jguerin/zfs-fedora-ostree
    install:
      install-weak-deps: false
      packages:
        - kmod-zfs
        - zfs
        - rizin
        - hashcat
        - radare2
        - qemu-system-x86
        - qemu-system-aarch64
        - edk2-aarch64
        - qemu-system-riscv
        - qemu-img
        - qemu-audio-pipewire
        - virglrenderer
        - qemu-device-display-virtio-gpu-gl
        - qemu-ui-opengl
        - qemu-audio-spice
        - qemu-char-spice
        - qemu-device-display-qxl
        - spice-gtk
        - libguestfs-tools
        - virt-install
        - virt-top
        - libvirt
        - libvirt-daemon-qemu
        - libvirt-daemon-driver-secret
        - libvirt-daemon-driver-nodedev
        - libvirt-daemon-driver-interface
        - libvirt-daemon-driver-nwfilter
        - libvirt-daemon-config-network
        - libvirt-daemon-driver-network
        - libvirt-daemon-driver-storage
        - libvirt-daemon-driver-storage-zfs
  - type: files
    files:
      - source: 99-cpu-governor.rules
        destination: /etc/udev/rules.d/99-cpu-governor.rules
      - source: 99-workstation-perf.conf
        destination: /etc/sysctl.d/99-workstation-perf.conf
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
