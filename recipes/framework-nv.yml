---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework-nv
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/ublue-os/ucore-hci
image-version: testing-nvidia
# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
        - yalter/niri
    install:
      packages:
        - glibc-langpack-en
        - sddm-conf
        - sddm-wayland-generic
        - waybar
        - fuzzel
        - kitty
        - niri
        - vim
        - fzf
        - ripgrep
        - zoxide
        - fd-find
        - bat
        - eza
        - btop
        - nvtop
        - radeontop
        - starship
        - tree-sitter-cli
        - rocm-smi-devel
        - neovim
        - python3-neovim
        - wl-clipboard
        - luarocks
        - git
        - wget
        - s-tui
        - stress-ng
        - libdrm-devel
        - gdu
        - ncdu
        - tree
        - diskus
        - nmap
        - traceroute
        - whois
        - swaybg
        - flatpak
        - loupe
    remove:
      packages:
        - nano
        - alacritty
        - nano-default-editor
        - nfs-client-utils
        - nfs-common-utils
        - azure-vm-utils
        - cockpit
        - cockpit-bridge
        - cockpit-ws

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks
          - net.codelogistics.webapps
          - net.waterfox.waterfox
          - org.virt_manager.virt-manager
      - scope: user # Also add Flathub user repo, but no user packages

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      url-fonts:
        - name: VictorMonoNerdFont
          url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/VictorMono.zip

  - type: script
    snippets:
      - |
        echo "Fetching and installing the latest Herdr release from GitHub..."
        # Herdr provides an automated direct installation utility script that detects system architecture
        # and downloads the binary to a localized configuration directory. 
        # We manipulate the process to safely place it into /usr/bin.
        curl -fsSL https://herdr.dev | bash

        # Relocate the freshly fetched standalone binary to an executable layer that survives atomic updates
        if [ -f /root/.herdr/packages/standalone/releases/latest/herdr ]; then
            mv /root/.herdr/packages/standalone/releases/latest/herdr /usr/bin/herdr
        elif [ -f /root/.local/share/herdr/bin/herdr ]; then
            mv /root/.local/share/herdr/bin/herdr /usr/bin/herdr
        fi

      - |
        echo "Fetching and installing the latest Flyline release from GitHub..."
        # 1. Look up Flyline's latest release tarball or specific Linux build file from GitHub
        FLYLINE_URL=$(curl -s https://github.com | \
          grep -oP '"browser_download_url": "\K[^"]*linux[^"]*' | head -n 1)

        # If Flyline packages as a raw executable, single .so loadable object, or a zipped archive,
        # we pull it into a temporary workspace.
        curl -L "$FLYLINE_URL" -o /tmp/flyline_latest

        # 2. Check if the output file is an archive or a direct library binary file, and place it.
        # Ensure it is moved to a reliable global share for Bash hooks (e.g. /usr/bin/flyline or /usr/lib/bash/)
        chmod +x /tmp/flyline_latest
        mv /tmp/flyline_latest /usr/bin/flyline

  - type: signing
