---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: framework-chrome
description: for humans- by lesbidoodles ; with hope for a better future
base-image: ghcr.io/celestial-uprising/framework-base
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "chrome"
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    repos:
      copr:
        - ulysg/xwayland-satellite
        - yalter/niri-git
        - sneexy/zen-browser
        - ferdiu/moonlight
    install:
      packages:
        - pcmanfm-qt
        - sddm
        - sddm-wayland-generic
        - swaybg
        - swaylock
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - niri
        - xwayland-satellite
        - wl-clipboard
        - fuzzel
        - kitty
        - waybar
        - zen-browser
        - remmina
        - flatpak
        - virt-manager
        - virt-viewer
        - moonlight-qt
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - md.obsidian.Obsidian
          - io.github.olaproeis.Ferrite
          - com.valvesoftware.SteamLink
          - de.haeckerfelix.Shortwave
          - net.codelogistics.webapps
          - de.z_ray.OptimusUI ### NV ONLY
      - scope: user
  - type: signing
