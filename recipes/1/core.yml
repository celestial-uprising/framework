# yaml-language-server: $schema=https://blue-build.org
name: core
description: Celestial Uprising's Immutable Operating System
base-image: ghcr.io/celestial-uprising/prebake
image-version: latest
modules:
  - type: os-release
    properties:
      VARIANT: "core"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - zram-generator
        - zram-generator-defaults
        - bash-completion
        - whois
        - distrobox
        - sshfs
        - rsync
        - linux-firmware
        - iw
        - iwd
        - iwlwifi-mvm-firmware
        - NetworkManager-wifi
        - pciutils
        - kernel-modules-extra
        - glibc-langpack-en
        - tailscale
        - libvirt-client
        - vim
        - nmap
        - traceroute
        - uv
        - neovim
        - python3-neovim
        - luarocks
        - tree-sitter-cli
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - fzf
        - pdfgrep
        - powertop
        - nvtop
        - radeontop
        - s-tui
        - lm_sensors
        - btop
        - gdu
        - hyperfine
        - pastel
        - git
        - jq
  - type: copy
    from: rusty
    src: /tmp/bin/
    dest: /usr/bin/
  - type: script
    scripts:
      - lazyvim.sh
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: wayblue-signing
    source: local
