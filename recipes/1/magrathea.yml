name: magrathea
description: ublue images for wayland compositors
base-image: ghcr.io/celestial-uprising/random
image-version: latest

modules:
    - type: os-release
      properties:
        VARIANT: "magrathea"
    - type: default-flatpaks
      configurations:
        - notify: true
          scope: system
          install:
            - md.obsidian.Obsidian
            - com.valvesoftware.SteamLink
            - de.haeckerfelix.Shortwave
            - net.codelogistics.webapps
    - type: kargs
      kargs:
        - amd_iommu=on
        - iommu=pt
        - kvm_amd.nested=1
        - amd_pstate=active
        - split_lock_detect=off
        - transparent_hugepage=always
        - kvm.ignore_msrs=1
        - net.ifnames=0
        - tcp_congestion_control=bbr
        - msr.allow_writes=on
        - amdgpu.ppfeaturemask=0xffffffff
        - pcie_aspm=off
        - amdgpu.sg_display=0
        - nvme_core.default_ps_max_latency=0
    - type: fonts
      fonts:
        nerd-fonts:
          - VictorMono
    - type: dnf
      repos:
        copr:
          - ulysg/xwayland-satellite
          - yalter/niri-git
          - sneexy/zen-browser
          - ferdiu/moonlight
          - skoved/rmpc
      install:
        install-weak-deps: false
        packages:
          - tailscale
          - kf6-qqc2-desktop-style
          - kf6-kirigami-addons
          - kirigami-app-components
          - kf6-kio-gui
          - kf6-kiconthemes
          - kf6-kirigami
          - qt6-qtdeclarative
          - qt6-qt5compat
          - qt6-qtwayland
          - sddm
          - sddm-themes
          - qt5-qtgraphicaleffects
          - qt5-qtquickcontrols2
          - qt5-qtsvg
          - kwallet
          - pam-kwallet
          - headsetcontrol
          - mediainfo
          - xfce-polkit 
          - xdg-user-dirs
          - dbus-tools
          - dbus-daemon
          - pavucontrol
          - playerctl
          - vulkan-validation-layers
          - vulkan-tools
          - alsa-firmware
          - pamixer
          - network-manager-applet
          - bluez-tools
          - blueman
          - thunar
          - thunar-archive-plugin 
          - xarchiver
          - imv
          - slurp
          - grim
          - wlr-randr
          - wlsunset
          - brightnessctl
          - kanshi
          - dunst
          - paper-icon-theme
          - ffmpegthumbnailer
          - mpv
          - ffmpeg
          - ffmpegthumbnailer
          - mpd
          - mpc
          - rmpc
          - imv
          - swaybg
          - swaylock
          - swayidle
          - xdg-desktop-portal-gnome
          - xdg-desktop-portal-gtk
          - niri
          - xwayland-satellite
          - fuzzel
          - kitty
          - waybar
          - zen-browser
          - remmina
          - flatpak
          - virt-manager
          - virt-viewer
          - moonlight-qt
          - playerctl
          - brightnessctl
          - wireplumber
          - network-manager-applet
          - gitui
      remove:
        packages:
          - firefox

    - type: script
      scripts:
        - setsddmtheming.sh
        - setniriwaybarmodules.sh
        - fixxdgdesktopportalservice.sh
        - removeunusedrepos.sh
        - regenerateinitramfs.sh

    - type: files
      files:
        - source: kitty-kitty.conf
          destination: /etc/xdg/kitty/kitty.conf
        - source: system/niri
          destination: /
        - source: system/usr
          destination: /usr
        - source: system/etc
          destination: /etc
        - source: systemd
          destination: /etc/systemd

    - type: gschema-overrides
      include:
        - zz1-wayblue-theming.gschema.override

    - type: systemd
      system:
        enabled:
          - sddm-boot.service
      user:
        enabled:
          - wayblue-update-verification.service
