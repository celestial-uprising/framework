# yaml-language-server: \$schema=https://blue-build.org
name: base
description: ublue images for wayland compositors
base-image: ghcr.io/celestial-uprising/rusty
image-version: latest


modules: 


    - type: os-release
      properties:
        VARIANT: "base"


    - type: akmods
      install:
        - zfs


    - type: kargs
      kargs:
        - amd_iommu=on
        - iommu=pt
        - kvm_amd.nested=1
        - split_lock_detect=off
        - transparent_hugepage=always
        - kvm.ignore_msrs=1
        - net.ifnames=0
        - tcp_congestion_control=bbr
        - msr.allow_writes=on


    - type: dnf

      repos:
        copr:
          - lihaohong/yazi
          - atim/bottom
          - atim/gping
          - atim/lazygit
          - atim/starship
          - kylegospo/amdctl
          - greg-at-redhat/glowm
        files:
          - https://copr.fedorainfracloud.org/coprs/ublue-os/packages/repo/fedora-%OS_VERSION%/ublue-os-packages-fedora-%OS_VERSION%.repo

      install:
        install-weak-deps: false
        packages:
          - tailscale
          - yazi
          - bottom
          - gping
          - gitui
          - libvirt-client
          - libvirt-client-qemu
          - tree
          - chromium-headless
          - glowm
          - lazygit
          - starship
          - amdctl
          - cascadia-code-nf-fonts
          - neovim
          - fd-find
          - ripgrep
          - zoxide
          - bat
          - eza
          - luarocks
          - tree-sitter-cli
          - python3-neovim
          - btop
          - gdu
          - wget
          - git
          - diskus
          - nmap
          - traceroute
          - whois
          - rustup
          - powerstat
          - fzf
          - ddcutil
          - openssl
          - distrobox

      remove:
        packages:
          - libva
          - mesa-dri-drivers
          - gstreamer1-plugin-libav
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-vulkan-drivers
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - ffmpeg-free
          - fdk-aac-free
          - gstreamer1-plugins-ugly-free
          - libavcodec-free
          - libavdevice-free
          - libavfilter-free
          - libavformat-free
          - libavutil-free
          - libpostproc-free
          - libswresample-free
          - libswscale-free
          - firefox
          - nano
          - nano-default-editor
          - nfs-client-utils
          - nfs-common-utils
          - azure-vm-utils
          - cockpit
          - cockpit-bridge
          - cockpit-ws


    - type: script
      scripts:
        - installsignedkernel.sh
        - ensureautoupdates.sh
        - addimageinfo.sh
        - installrpmfusion.sh
        - removeunusedrepos.sh
        - regenerateinitramfs.sh
        - ensurenegativopresence.sh


    - type: files
      files:
        - source: system/usr
          destination: /usr
        - source: system/etc
          destination: /etc
        - source: systemd
          destination: /etc/systemd
        - source: flyline.sh
          destination: /etc/profile.d/flyline.sh
        - source: distrobox-aliases.sh
          destination: /etc/profile.d/distrobox-aliases.sh


    - type: fonts
      fonts:
        nerd-fonts:
          - VictorMono


    - type: wayblue-signing
      source: local
