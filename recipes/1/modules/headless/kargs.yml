type: kargs
kargs:
  - amd_iommu=on
  - iommu=pt
  - kvm_amd.nested=1
  - amd_pstate=active
  - split_lock_detect=off
  - transparent_hugepage=always
  - kvm.ignore_msrs=1
  - net.ifnames=0
  - tcp_congestion_control=bbr
  - msr.allow_writes=on
  - amdgpu.ppfeaturemask=0xffffffff
  - pcie_aspm=off
  - nvme_core.default_ps_max_latency=0
  - zfs.zfs_arc_max=17179869184
