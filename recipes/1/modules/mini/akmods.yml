# yaml-language-server: $schema=https://blue-build.org
---
modules:
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/akmods:coreos-testing / /tmp/akmods-common
      - RUN dnf install -y /tmp/akmods-common/rpms/ublue-os/ublue-os-akmods*.rpm
      - RUN dnf install -y /tmp/akmods-common/rpms/kmods/kmod-ryzen-smu*.rpm
      - RUN dnf install -y /tmp/akmods-common/rpms/kmods/kmod-zenergy*.rpm
      - RUN rm -rf /tmp/akmods-common
