type: dnf
repos:
  copr:
    - atim/lazygit
    - atim/starship
install:
  packages:
    - lazygit
    - starship
    - glibc-langpack-en
    - neovim
    - fzf
    - fd-find
    - ripgrep
    - zoxide
    - bat
    - eza
    - luarocks
    - tree-sitter-cli
    - python3-neovim
    - btop
    - tree
    - vim
    - git
    - wget
    - gdu
    - nmap
    - traceroute
    - whois
    - rustup
    - qemu-guest-agent
    - spice-vdagent
remove:
  packages:
    - linux-firmware
    - iw
    - wpa_supplicant
    - bluez
    - lm_sensors
    - smartmontools
    - nano
    - nano-default-editor
    - nfs-client-utils
    - nfs-common-utils
    - azure-vm-utils
    - cockpit
    - cockpit-bridge
    - cockpit-ws
