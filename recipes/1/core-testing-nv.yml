# yaml-language-server: $schema=https://blue-build.org
name: core-testing-nv
description: Celestial-Uprising's Immutable Operating System
base-image:  ghcr.io/wayblueorg/niri-nvidia
image-version: latest
stages:
  - name: rusty
    from: quay.io/fedora/fedora:44
    modules:
      - type: copy
        src: files/cargo-nobinstall.md
        dest: /tmp/cargo-nobinstall.md
      - type: copy
        src: files/cargo-install.md
        dest: /tmp/cargo-install.md
      - type: copy
        src: files/goblin-install.md
        dest: /tmp/goblin-install.md
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - |
            dnf5 upgrade -y && dnf5 install -y \
              zig libdrm-devel pkg-config pam-devel cargo rustc \
              systemd-devel libunwind-devel elfutils-devel \
              protobuf-compiler perl clang-devel llvm-devel \
              openssl-devel dbus-devel jack-audio-connection-kit-devel \
              alsa-lib-devel cmake make gcc-c++ python3 python3-devel \
              fontconfig-devel m4 pipewire-devel libva-devel libcxx-devel \
              llvm-libunwind libpcap-devel golang \
              libusb1-devel bluez-libs-devel pulseaudio-libs-devel libcap-devel zlib-devel \
              tar gzip curl
            curl -fsSL https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xz -C /usr/bin cargo-binstall
            FAILED_TOOLS=()
            MD_FILE="/tmp/cargo-nobinstall.md"
            if [ ! -f "$MD_FILE" ]; then
              echo "Error: $MD_FILE not found!"
              exit 1
            fi
            while read -r line || [ -n "$line" ]; do
              case "$line" in
                *"cargo install"*)
                  echo "----------------------------------------"
                  echo "Executing: $line --root /tmp"
                  $line --root /tmp
                  ;;
              esac
            done < "$MD_FILE"
            MD_FILE1="/tmp/cargo-install.md"
            if [ -f "$MD_FILE1" ]; then
              while read -r line || [ -n "$line" ]; do
                case "$line" in
                  *"cargo install"*)
                    echo "----------------------------------------"
                    pkg_args=$(echo "$line" | sed 's/cargo install //')
                    echo "Processing Cargo package: $pkg_args"
                    if ! cargo binstall -y --root /tmp $pkg_args 2>/dev/null; then
                      echo "cargo-binstall failed for '$pkg_args'. Compiling via cargo install..."
                      if ! $line --root /tmp; then
                        echo "ERROR: Failed to install Cargo crate: $pkg_args"
                        FAILED_TOOLS+=("Cargo: $line")
                      fi
                    fi
                    ;;
                esac
              done < "$MD_FILE1"
            fi
            MD_FILE2="/tmp/goblin-install.md"
            if [ -f "$MD_FILE2" ]; then
              while read -r line || [ -n "$line" ]; do
                case "$line" in
                  *"go install"*)
                    echo "----------------------------------------"
                    echo "Executing Go install: $line"
                    if ! env GOBIN=/tmp/bin $line; then
                      echo "ERROR: Failed to install Go tool: $line"
                      FAILED_TOOLS+=("Go: $line")
                    fi
                    ;;
                esac
              done < "$MD_FILE2"
            fi
            if [ ${#FAILED_TOOLS[@]} -ne 0 ]; then
              echo "========================================"
              echo "BUILD FAILED: The following tools failed to install:"
              printf '%s\n' "${FAILED_TOOLS[@]}"
              echo "========================================"
              exit 1
            fi
            ls -1 /tmp/bin > /tmp/custom-binaries.list
modules:
  - type: os-release
      properties:
        NAME: "Celestial Uprising"
        PRETTY_NAME: "Celestial Uprising aTESTING"
        VERSION_CODENAME: "no-transformers"
        ID_LIKE: fedora
        HOME_URL: "https://github.com/celestial-uprising/framework/"
        BUG_REPORT_URL: "https://github.com/celestial-uprising/framework/"
      VARIANT: "core-testing-nv"
        RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
      - msr.allow_writes=on
  - type: dnf
    repos:
      copr:
        - lihaohong/yazi
        - atim/lazygit
        - kylegospo/amdctl
        - greg-at-redhat/glowm
    install:
      install-weak-deps: false
      packages:
        - just
        - glibc-langpack-en
        - firewall-config
        - ansible-core
        - tailscale
        - links
        - libvirt-client
        - wget
        - nmap
        - traceroute
        - whois
        - ddcutil
        - uv
        - yazi
        - vim
        - neovim
        - python3-neovim
        - lazygit
        - luarocks
        - tree-sitter-cli
        - fd-find
        - ripgrep
        - zoxide
        - bat
        - eza
        - fzf
        - pdfgrep
        - powerstat
        - powertop
        - cpufetch
        - amdctl
        - btop
        - libunwind
        - tree
        - ncdu
        - diskonaut
        - dust
        - hyperfine
        - procs
        - pastel
        - git
        - git-interactive-rebase-tool
        - tig
        - gitui
        - glowm
        - chromium-headless
        - ov
    remove:
      packages:
        - papirus-icon-theme
        - firefox
        - nano
        - nano-default-editor
        - android-tools
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-workstation-backgrounds
        - gamemode
        - gnome-disk-utility
        - gnome-icon-theme
        - hfsplus-tools
        - jomolhari-fonts
        - madan-fonts
        - ntfs-3g
        - ntfsprogs
        - open-sans-fonts
        - orca
        - rit-meera-new-fonts
        - rit-rachana-fonts
        - vazirmatn-vf-fonts
  - type: copy
    from: rusty
    src: /tmp/bin/
    dest: /usr/bin/
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
        - CascadiaCode
  - type: containerfile
    snippets:
      - RUN sed -i 's/#override_install_langs=/override_install_langs=en_US/g' /etc/dnf/dnf.conf || true
      - RUN find /usr/share/locale/* -maxdepth 0 -type d ! -name "en" ! -name "en_US" ! -name "en_GB" -exec rm -rf {} +
      - RUN rm -rf /usr/share/soundfonts
# Inside your recipe.yml modules list
modules:
  - type: containerfile
    snippets:
      - RUN sed -i 's/#override_install_langs=/override_install_langs=en_US/g' /etc/dnf/dnf.conf || true
      - RUN find /usr/share/locale/* -maxdepth 0 -type d ! -name "en" ! -name "en_US" ! -name "en_GB" -exec rm -rf {} +
      - RUN find /usr/share/fonts/google-noto* -maxdepth 0 -type d ! -name "*Sans*" ! -name "*Serif*" -exec rm -rf {} + || true
      - RUN rm -rf /usr/share/fonts/google-noto-vf /usr/share/fonts/lohit* /usr/share/fonts/sil-padauk || true
      - RUN fc-cache -f
      - RUN rm -rf /usr/share/doc/* /usr/share/info/* /usr/share/gnome/help/* || true
      - RUN rm -rf /usr/share/soundfonts
  - type: files
    files:
      - source: system/usr/lib/bash/libflyline.so.1.9.0
        destination: /usr/lib/bash/libflyline.so.1.9.0
  - type: files
    files:
      - source: system/etc/profile.d/
        destination: /etc/profile.d/
  - type: script
    scripts:
      - regenerateinitramfs.sh
  - type: script
    snippets:
      - |
        echo "LANG=en_US.UTF-8" > /etc/locale.conf

      - |
        echo "Checking custom compiled binaries for missing runtime shared libraries..."
        if [ -f /tmp/custom-binaries.list ]; then
          while read -r bin_name || [ -n "$bin_name" ]; do
            [ -z "$bin_name" ] && continue
            bin_path="/usr/bin/$bin_name"
            if [ -f "$bin_path" ] && [ -x "$bin_path" ]; then
              missing=$(ldd "$bin_path" 2>/dev/null | grep "not found" || true)
              if [ -n "$missing" ]; then
                echo "WARNING: $bin_path is missing runtime dynamic libraries:"
                echo "$missing"
              fi
            fi
          done < /tmp/custom-binaries.list
          rm -f /tmp/custom-binaries.list
        fi
  - type: wayblue-signing
    source: local
