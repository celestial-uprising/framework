name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-universal-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Generate Universal Net-Boot ISO
        run: |
          mkdir -p ./output

          # 1. Pull and compile your baseline container image
          sudo podman pull quay.io/centos-bootc/centos-bootc:stream9
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./config.toml:/config.toml:ro \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            quay.io/centos-bootc/centos-bootc:stream9

          # FIX PERMISSIONS: Reclaim ownership of the output directory from root
          sudo chown -R $(id -u):$(id -g) ./output

          # 2. Setup your local extraction tools
          sudo apt-get update && sudo apt-get install -y xorriso isolinux

          # 3. FIXED: Find the actual hashed .iso file name automatically
          #TARGET_ISO=$(ls ./output/anaconda-iso/*.iso | head -n 1)
          TARGET_ISO=$(ls ./*/*/*.iso | head -n 1)
          #TARGET_ISO=/run/osbuild/tree/install.iso
          echo "Target ISO found: $TARGET_ISO"

          # 4. Extract the contents cleanly
          mkdir -p ./iso_tmp
          xorriso -osirrox on -indev "$TARGET_ISO" -extract / ./iso_tmp

            # 5. Append your interactive 13 spins menu options to the GRUB configuration
          cat << 'EOF' >> ./iso_tmp/boot/grub2/grub.cfg

          menuentry 'Celestial-Uprising VIRT' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/virt:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising HEADLESS' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/headless:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising HEADLESS_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/headless-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising MINI' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/mini:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising MINI_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/mini-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising DEV' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/dev:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising DEV_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/dev-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising MUSE' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/muse:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising MUSE_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/muse-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising GG' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/gg:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising GG_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/gg-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising UNHOLY' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/unholy:latest
              initrd /images/pxeboot/initrd.img
          }
          menuentry 'Celestial-Uprising UNHOLY_NVIDIA' --class fedora --class gnu-linux {
              linux /images/pxeboot/vmlinuz inst.text bootc.next=ghcr.io/celestial-uprising/unholy-nv:latest
              initrd /images/pxeboot/initrd.img
          }
          EOF

          xorriso -as mkisofs -V "BOOTC_NET" \
            -eltorito-alt-boot -e images/efiboot.img -no-emul-boot \
            -o ./output/universal-installer.iso ./iso_tmp

      - name: Upload Installer ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "./output/universal-installer.iso"
          tag_name: universal-installer-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

