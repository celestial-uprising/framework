name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  generate-universal-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Generate Universal Net-Boot ISO
        run: |
          mkdir -p ./output

          # 1. Dynamically read your kickstart file and embed it safely inside a TOML block
          python3 -c '
          import json, os
          with open("universal-installer.cfg", "r") as f:
              ks_content = f.read()
          config = {"customizations": {"installer": {"kickstart": {"contents": ks_content}}}}
          with open("config.json", "w") as f:
              json.dump(config, f)
          '

          # 2. Run the build passing your structured configuration
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v .:/config:ro \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config/config.json \
            quay.io/centos-bootc/centos-bootc:stream9
      - name: Upload Small Universal ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "./output/boot.iso"
          tag_name: universal-installer-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
