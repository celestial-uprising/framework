name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  generate-universal-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Generate Universal Net-Boot ISO
        run: |
          mkdir -p ./output
          sudo podman run --rm --privileged \
            -v .:/config:ro \
            -v ./output:/output \
            ghcr.io/osbuild/image-builder:latest \
            build \
            --blueprint /config/universal-installer.cfg \
            --bootc-ref quay.io/centos-bootc/centos-bootc:stream9 \
            bootc-installer
      - name: Upload Small Universal ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "./output/boot.iso"
          tag_name: universal-installer-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
