name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  stage_one:
    name: Build Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        recipe:
          - r/1/virt.yml
          - r/1/virt_nv.yml
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Inject AGGRO Compiled Binaries and AOCC Compiler Installer
        run: |
          mkdir -p config/bins
          cp -r config/BINS_INJECT/* config/bins/ 2>/dev/null || true
      - name: Building Framework Base Images [virt/virt_nv]
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
  stage_two:
    name: Building Stage Two Images [mini/nv + headless/nv] 
    runs-on: ubuntu-latest
    needs: stage_one
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false 
      matrix:
        recipe:
          - r/2/mini.yml
          - r/2/mini_nv.yml
          - r/2/headless.yml
          - r/2/headless_nv.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Building Stage Two Images [mini/nv + headless/nv] 
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false
  stage_three:
    name: Building Stage Three Images [ws/nv + gg/nv] 
    runs-on: ubuntu-latest
    needs: stage_two
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false 
      matrix:
        recipe:
          - r/3/ws.yml
          - r/3/ws_nv.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Building Stage Three Images [ws/nv + gg/nv] 
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false
