name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        recipe:
          - framework_virt.yml
          - framework_virt_nv.yml
    steps:
      - name: Build Framework Virt Images
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          prune: true
  build-variants:
    name: Build Downstream Variants
    runs-on: ubuntu-latest
    needs: build-base
    strategy:
      fail-fast: false 
      matrix:
        recipe:
          - framework_mini.yml
          - framework_mini_nv.yml
          - framework_headless.yml
          - framework_headless_nv.yml
          - framework_workstation.yml
          - framework_workstation_nv.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Variant Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }} # Dynamically loads from the matrix list
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          prune: true
          maximize_build_space: false
