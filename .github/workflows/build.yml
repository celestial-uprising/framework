name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  stage_one:
    name: Build Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        recipe:
          - r/1/virt.yml
          - r/1/virt_nv.yml
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Inject AGGRO Compiled Binaries and AOCC Compiler Installer
        run: |
          # 1. Debug: Let's see exactly where your RPM file is hidden
          echo "=== Finding all RPM files in the workspace ==="
          find . -name "*.rpm"
          
          # 2. Re-create directories cleanly
          mkdir -p config/bins
          mkdir -p config/rpms
          
          # 3. Copy files safely (using find so paths don't break)
          cp -r config/BINS_INJECT/* config/bins/ 2>/dev/null || true
          
          # This will find your 145MB RPM wherever it is and copy it to the right spot
          find . -maxdepth 2 -name "*.rpm" -not -path "*/rpms/*" -exec cp {} config/rpms/ \;

          # 4. Debug: Verify the file actually landed in the destination folder
          echo "=== Content of config/rpms/ ==="
          ls -lh config/rpms/
      - name: Building Framework Base Images [virt/virt_nv]
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
  stage_two:
    name: Building Stage Two Images [mini/nv + headless/nv] 
    runs-on: ubuntu-latest
    needs: stage_one
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false 
      matrix:
        recipe:
          - r/2/mini.yml
          - r/2/mini_nv.yml
          - r/2/headless.yml
          - r/2/headless_nv.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Building Stage Two Images [mini/nv + headless/nv] 
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false
  stage_three:
    name: Building Stage Three Images [ws/nv + gg/nv] 
    runs-on: ubuntu-latest
    needs: stage_two
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false 
      matrix:
        recipe:
          - r/3/ws.yml
          - r/3/ws_nv.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Building Stage Three Images [ws/nv + gg/nv] 
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: false
