# Initialize network with DHCP so the pre-install script can fetch from GHCR
network --bootproto=dhcp --activate --onboot=on

# Force interactive GUI screens for disk selection, language, and custom users
interactive
text

# Pull the dynamic container image choice from the pre-installation step
%include /tmp/chosen-image.cfg

%anaconda
# Force user creation configuration screen to be visible and editable
pwpolicy root --minlen=6 --minquality=1 --strict --nochanges --emptyok
pwpolicy user --minlen=6 --minquality=1 --strict --nochanges --emptyok
%end

%pre --log=/tmp/interactive-select.log
#!/bin/bash
# Re-route input/output to Virtual Console 3 for user interaction
exec < /dev/tty3 > /dev/tty3 2>&1
chvt 3

clear
echo "=================================================="
echo "     SELECT YOUR CELESTIAL-UPRISING OS SPIN!      "
echo "=================================================="
echo "1) virt         2/3) mini(-nv)   4/5) headless(-nv)"
echo "6/7) dev(-nv)   8/9) muse(-nv)   10/11) gg(-nv)"
echo "12/13) unholy(-nv)"
echo "=================================================="
read -p "Enter selection (1-13): " CHOICE

case $CHOICE in
    1) IMG="ghcr.io/celestial-uprising/virt:latest" ;;
    2) IMG="ghcr.io/celestial-uprising/mini:latest" ;;
    3) IMG="ghcr.io/celestial-uprising/mini-nv:latest" ;;
    4) IMG="ghcr.io/celestial-uprising/headless:latest" ;;
    5) IMG="ghcr.io/celestial-uprising/headless-nv:latest" ;;
    6) IMG="ghcr.io/celestial-uprising/dev:latest" ;;
    7) IMG="ghcr.io/celestial-uprising/dev-nv:latest" ;;
    8) IMG="ghcr.io/celestial-uprising/muse:latest" ;;
    9) IMG="ghcr.io/celestial-uprising/muse-nv:latest" ;;
    10) IMG="ghcr.io/celestial-uprising/gg:latest" ;;
    11) IMG="ghcr.io/celestial-uprising/gg-nv:latest" ;;
    12) IMG="ghcr.io/celestial-uprising/unholy:latest" ;;
    13) IMG="ghcr.io/celestial-uprising/unholy-nv:latest" ;;
    *) IMG="ghcr.io/celestial-uprising/virt:latest" ;;
esac

# Dynamically inject the selected container target into Anaconda
echo "ostreecontainer --url=$IMG" > /tmp/chosen-image.cfg

# Return focus back to the graphical installation environment
chvt 1
%end

